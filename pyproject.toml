[project]
name = "robot-learning-lab"
version = "0.1.0"
description = "Simulation-based robot imitation learning and serving experiments"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "lerobot[training]==0.6.1",
    "gym-hil==0.1.14",
    "mujoco>=3.0,<3.9",
    "gymnasium>=1.1.1,<2",
    "numpy>=2,<2.3",
    "pandas>=2,<4",
    "scipy>=1.14,<2",
    "scikit-learn>=1.5,<2",
    "matplotlib>=3.9,<4",
    "imageio[ffmpeg]>=2.34,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29,<8",
    "jupyterlab>=4.2,<5",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
